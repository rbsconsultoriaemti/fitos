server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Só /admin/* é servido aqui (o Traefik não manda mais nada para este container).
  location = /admin {
    return 301 /admin/;
  }

  # Arquivos com hash no nome: cache longo.
  location /admin/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Fallback de SPA: qualquer outra rota de /admin/* devolve o index.html (sem cache, para pegar builds novos).
  location /admin/ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "same-origin";
    try_files $uri $uri/ /admin/index.html;
  }

  location / {
    return 404;
  }
}
